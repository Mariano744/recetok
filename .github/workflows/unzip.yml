name: Descomprimir app
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y guardar
        run: |
          if [ -f recetok-app.zip ]; then
            unzip -o recetok-app.zip
            git rm -q recetok-app.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Descomprimir app"
            git push
          fi
